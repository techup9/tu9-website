scripts:
  - name: Setup
    command: npm install
    triggers:
      - session.create
  - name: Run
    command: NO_COLOR=1 npm run dev
  - name: Build
    command: npm run build
  - name: Preview build
    command: npm run build && NO_COLOR=1 npm run preview
  - name: Archive cleanup
    command: rm -rf node_modules dist
    triggers:
      - session.archive

server_ready_pattern: '(?i)Local:\s+(https?://\S+)'
auto_open_in_browser: true
